[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelbi-backend"
version = "0.1.0"
description = "SentinelBI API, ingestion worker and services."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary,pool]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pyjwt>=2.9",
  "argon2-cffi>=23.1",
  "redis>=5.2",
  "httpx>=0.27",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "joblib>=1.4",
  "sentinelbi-ml",
  "reportlab>=5.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "pandas-stubs",
  "types-pyyaml",
  "netflow>=0.12",  # collector tests import the collector package (see collector/)
]

[tool.uv.sources]
sentinelbi-ml = { path = "../ml", editable = true }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["$MYPY_CONFIG_FILE_DIR", "$MYPY_CONFIG_FILE_DIR/../collector"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["netflow.*", "sentinelbi_ml.*", "joblib.*", "xgboost.*", "lightgbm.*", "sklearn.*", "reportlab.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
