name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, collector and ML tests
    runs-on: ubuntu-latest
    # The tests use a real TimescaleDB and Redis (no mocks); same images as docker-compose.yml.
    services:
      db:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: dev-only-change-me
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinel -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.9-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Lint (ruff)
        run: |
          uv run --project backend ruff check .
          uv run --project backend ruff format --check .
      - name: Types (mypy)
        run: uv run --project backend mypy --config-file backend/pyproject.toml backend/app collector
      - name: Tests
        # conftest.py defaults point at 127.0.0.1:5432 / :6379, which the service containers publish
        run: uv run --project backend pytest -q

  frontend:
    name: Frontend lint, types and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
