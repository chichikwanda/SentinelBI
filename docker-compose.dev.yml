# Developer override: hot reload with source bind-mounted.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/repo/backend
      - ./ml:/repo/ml
  worker:
    volumes:
      - ./backend:/repo/backend
      - ./ml:/repo/ml
