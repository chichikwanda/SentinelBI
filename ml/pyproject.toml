[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelbi-ml"
version = "0.1.0"
description = "SentinelBI feature definitions and training code, shared by training and serving."
requires-python = ">=3.11"
# Only what the *serving* path needs. Heavy training deps live in the `train` extra.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
# Training environment (`uv run --project ml --extra train ...`). SHAP-style per-prediction
# contributions come from LightGBM/XGBoost natively (pred_contrib), so the heavy `shap`
# package is not required; Optuna tuning is deferred.
train = [
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "joblib>=1.4",
]

# The plan lays code out as ml/src/*.py. Map that directory to the importable
# package `sentinelbi_ml` so backend and training both `import sentinelbi_ml.features`.
[tool.setuptools]
packages = ["sentinelbi_ml"]

[tool.setuptools.package-dir]
sentinelbi_ml = "src"
