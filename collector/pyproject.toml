[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelbi-collector"
version = "0.1.0"
description = "UDP NetFlow v5/v9/IPFIX listener: allow-lists exporters, normalises flows, pushes to Redis Streams."
requires-python = ">=3.11"
dependencies = [
  "netflow>=0.12",
  "redis>=5.2",
  "psycopg[binary]>=3.2",
]

# Deployment unit, not a library: run from this directory (`python collector.py`).
[tool.uv]
package = false
