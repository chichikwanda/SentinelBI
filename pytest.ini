[pytest]
# Run from the repo root (testpaths only apply there): `uv run --project backend pytest`,
# or `make test` (the compose test service uses /repo as its working directory).
testpaths = tests/backend tests/collector tests/ml tests/sensor
pythonpath = backend collector sensor tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
addopts = -ra --strict-markers
filterwarnings =
    ignore:No path_separator found in configuration:DeprecationWarning:alembic.*
