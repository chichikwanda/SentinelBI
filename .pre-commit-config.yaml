# Install once: `uvx pre-commit install`. Run everything: `uvx pre-commit run --all-files`.
# ruff/mypy run from the locked backend environment so hook and CI versions cannot drift.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --project backend mypy --config-file backend/pyproject.toml backend/app collector
        language: system
        pass_filenames: false
        files: ^(backend|collector)/.*\.py$
      - id: frontend-lint
        name: frontend lint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/
